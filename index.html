<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="REMI.FLOW">
<meta name="color-scheme" content="light only">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>REMI.FLOW</title>
<style>
:root {
  --bg: #F5F5F0;
  --surface: #FFFFFF;
  --border: #E8E8E4;
  --text: #1A1A1A;
  --text2: #555;
  --text3: #999;
  --accent: #2E7D4F;
  --accent2: #059669;
  --blue: #3B82F6;
  --orange: #D97706;
  --purple: #7C3AED;
  --danger: #EF4444;
  --warning: #F59E0B;
  --radius: 14px;
  --shadow: 0 1px 4px rgba(0,0,0,0.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg) !important; color: var(--text) !important; font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; min-height: 100vh; -webkit-text-size-adjust: 100%; color-scheme: light only; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: 72px; }

/* ── HEADER ── */
.hdr { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px 12px; position: sticky; top: 0; z-index: 100; }
.hdr-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.logo { font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
.logo em { color: var(--accent); font-style: normal; }
.today { font-size: 11px; color: var(--text3); background: var(--bg); padding: 4px 10px; border-radius: 12px; font-weight: 500; }
.page-dots { display: flex; gap: 5px; justify-content: center; }
.pdot { width: 5px; height: 5px; border-radius: 3px; background: #D1D1D6; transition: all 0.2s; }
.pdot.on { width: 18px; }

/* ── SWIPE ── */
.sw-wrap { overflow: hidden; touch-action: pan-y; }
.sw-inner { display: flex; transition: transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94); will-change: transform; }
.sw-page { min-width: 100vw; max-width: 480px; padding: 14px 14px 0; }

/* ── COMMON ── */
.sec-title { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin: 0 2px 7px; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
.card-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--bg); }
.card-row:last-child { border-bottom: none; }
.dot8 { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.row-body { flex: 1; min-width: 0; }
.row-title { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px; flex-shrink: 0; }
.chk { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid #D1D1D6; background: #F9F9F9; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.chk.on { background: var(--accent); border-color: var(--accent); }
.chk svg { width: 12px; height: 12px; stroke: white; fill: none; stroke-width: 2.5; }
.empty { text-align: center; padding: 24px; color: var(--text3); font-size: 13px; }

/* ── HOME ── */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat-box { background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
.stat-label { font-size: 11px; color: var(--text3); font-weight: 600; margin-bottom: 6px; }
.stat-val { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

/* FUND CARDS */
.fund-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.fund-card { background: var(--surface); border-radius: var(--radius); padding: 13px 14px; box-shadow: var(--shadow); }
.fund-title { font-size: 12px; font-weight: 700; color: var(--text2); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.fund-total { font-size: 20px; font-weight: 700; color: var(--danger); letter-spacing: -0.5px; margin-bottom: 8px; }
.fund-item { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); padding: 2px 0; }
.fund-item.done-item { opacity: 0.4; text-decoration: line-through; }
.fund-remain { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--bg); display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; }
.fund-chk { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #D1D1D6; background: #F9F9F9; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.fund-chk.on { background: var(--accent); border-color: var(--accent); }
.fund-chk svg { width: 11px; height: 11px; stroke: white; fill: none; stroke-width: 2.5; }

/* ── 가계부 ── */
.month-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.month-tabs::-webkit-scrollbar { display: none; }
.mtab { flex-shrink: 0; padding: 7px 13px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text2); font-size: 12px; cursor: pointer; font-weight: 500; }
.mtab.on { color: white; border-color: transparent; }
.sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.sum-box { background: var(--surface); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); }
.sum-label { font-size: 10px; color: var(--text3); margin-bottom: 3px; font-weight: 600; }
.sum-val { font-size: 16px; font-weight: 700; }
.prog-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
.prog-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.tx-section { margin-bottom: 10px; }
.tx-sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.tx-sec-label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }
.tx-sec-total { font-size: 12px; font-weight: 700; }
.tx-card { background: var(--surface); border-radius: 10px; margin-bottom: 4px; overflow: hidden; box-shadow: var(--shadow); }
.tx-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.tx-row.done-tx { opacity: 0.38; }
.tx-body { flex: 1; min-width: 0; }
.tx-name { font-size: 13px; font-weight: 500; color: var(--text); }
.tx-name.crossed { text-decoration: line-through; color: var(--text3); }
.tx-date { font-size: 11px; color: var(--text3); }
.tx-right { text-align: right; }
.tx-amount { font-size: 13px; font-weight: 600; }
.tx-amount.income { color: var(--blue); }
.tx-amount.expense { color: var(--danger); }
.tx-balance { font-size: 10px; color: var(--text3); }
.add-item-btn { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 8px; margin-bottom: 6px; background: var(--surface); border-radius: 10px; border: 1.5px dashed var(--border); cursor: pointer; color: var(--text3); font-size: 12px; font-weight: 500; box-shadow: var(--shadow); }
.inline-form { display: none; background: var(--surface); border-radius: 12px; padding: 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
.inline-form.open { display: block; }
.fi { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--border); font-size: 13px; color: var(--text); background: var(--bg); outline: none; font-family: inherit; margin-bottom: 7px; -webkit-appearance: none; }
.fi:focus { border-color: var(--accent); background: var(--surface); }
.fi-row { display: flex; gap: 6px; }
.f-btns { display: flex; gap: 6px; margin-top: 2px; }
.f-ok { flex: 1; padding: 10px; border-radius: 9px; background: var(--accent); color: white; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
.f-cancel { padding: 10px 13px; border-radius: 9px; background: var(--bg); color: var(--text3); border: none; font-size: 13px; cursor: pointer; }
.totals-card { background: var(--surface); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); margin-top: 12px; }
.tot-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; color: var(--text2); }
.tot-row.big { font-size: 15px; font-weight: 700; color: var(--text); border-top: 1px solid var(--border); margin-top: 6px; padding-top: 10px; }

/* ── SKINZIP PRODUCT CARDS ── */
.prod-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
.prod-head { padding: 14px 16px 12px; }
.prod-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.prod-name { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
.prod-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 10px; }
.prod-prog-wrap { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.prod-prog { height: 100%; border-radius: 3px; transition: width 0.4s; }
.prod-prog-nums { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); }
.prod-items { border-top: 1px solid var(--bg); }
.prod-item { border-bottom: 1px solid var(--bg); }
.prod-item:last-child { border-bottom: none; }
.prod-item-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; }
.prod-item-chk { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid #D1D1D6; background: #F9F9F9; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.prod-item-chk.on { background: var(--accent); border-color: var(--accent); }
.prod-item-chk svg { width: 12px; height: 12px; stroke: white; fill: none; stroke-width: 2.5; }
.prod-item-body { flex: 1; min-width: 0; }
.prod-item-title { font-size: 13px; font-weight: 500; color: var(--text); }
.prod-item-title.crossed { text-decoration: line-through; color: var(--text3); }
.prod-item-date { font-size: 11px; color: var(--text3); margin-top: 1px; }
.pri-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.prod-item-arr { font-size: 16px; color: #D1D1D6; flex-shrink: 0; transition: transform 0.2s; }
.prod-item-arr.open { transform: rotate(90deg); }
.prod-item-detail { display: none; padding: 0 14px 12px 46px; }
.prod-item-detail.open { display: block; }
.detail-text { font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 6px; }
.done-label { font-size: 11px; color: var(--text3); margin-bottom: 8px; }
.item-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--accent); background: #E8F5EE; padding: 4px 9px; border-radius: 7px; text-decoration: none; font-weight: 500; margin-bottom: 8px; }
.memo-area { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; color: var(--text); background: var(--bg); resize: none; outline: none; font-family: inherit; min-height: 54px; }
.memo-area:focus { border-color: var(--accent); background: var(--surface); }
.memo-save-btn { display: inline-block; margin-top: 5px; padding: 5px 12px; border-radius: 8px; background: var(--accent); color: white; border: none; font-size: 12px; font-weight: 600; cursor: pointer; }
.edit-row { display: flex; gap: 6px; margin-top: 4px; }
.edit-input { flex: 1; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; color: var(--text); background: var(--bg); outline: none; font-family: inherit; }
.edit-input:focus { border-color: var(--accent); background: var(--surface); }
.edit-save { padding: 7px 11px; border-radius: 8px; background: var(--accent); color: white; border: none; font-size: 12px; cursor: pointer; font-weight: 600; }
.prod-add-btn { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 10px; background: var(--bg); cursor: pointer; color: var(--text3); font-size: 12px; font-weight: 500; border: none; width: 100%; }
.prod-add-form { display: none; padding: 12px 14px; border-top: 1px solid var(--bg); background: var(--surface); }
.prod-add-form.open { display: block; }
.cat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cat-name-big { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.cat-cnt { font-size: 12px; color: var(--text3); }
.prog-strip { margin-bottom: 12px; }
.ps-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.ps-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.ps-nums { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-top: 5px; }

/* ── 구직/세무 TASK ── */
.m-group { margin-bottom: 12px; }
.m-label { font-size: 11px; font-weight: 700; color: #C7C7CC; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; padding: 0 2px; }
.tc { background: var(--surface); border-radius: 12px; margin-bottom: 5px; overflow: hidden; box-shadow: var(--shadow); }
.tc.done-tc { opacity: 0.38; }
.tc.urg { border-left: 3px solid var(--danger); }
.tc.hi { border-left: 3px solid var(--warning); }
.tc-head { display: flex; align-items: center; gap: 10px; padding: 11px 13px; cursor: pointer; }
.tc-chk { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid #D1D1D6; background: #F9F9F9; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.tc-chk.on { background: var(--accent); border-color: var(--accent); }
.tc-chk svg { width: 12px; height: 12px; stroke: white; fill: none; stroke-width: 2.5; }
.tc-body { flex: 1; min-width: 0; }
.tc-name { font-size: 13px; font-weight: 500; color: var(--text); }
.tc-name.crossed { text-decoration: line-through; color: var(--text3); }
.tc-date { font-size: 11px; color: var(--text3); margin-top: 2px; }
.tc-arr { font-size: 17px; color: #D1D1D6; flex-shrink: 0; transition: transform 0.2s; }
.tc-arr.open { transform: rotate(90deg); }
.tc-det { display: none; padding: 0 13px 11px 45px; }
.tc-det.open { display: block; }
.tc-det-text { font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 5px; }
.tc-done-label { font-size: 11px; color: var(--text3); margin-bottom: 7px; }
.tc-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--accent); background: #E8F5EE; padding: 4px 9px; border-radius: 7px; text-decoration: none; font-weight: 500; margin-bottom: 7px; }

/* ── BOTTOM NAV ── */
.bnav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; z-index: 200; max-width: 480px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom, 0); }
.nbtn { flex: 1; padding: 9px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text3); font-size: 9px; text-decoration: none; border: none; background: none; cursor: pointer; font-family: inherit; font-weight: 500; }
.nbtn svg { width: 22px; height: 22px; stroke-width: 1.5; fill: none; stroke: currentColor; }
.nbtn.on { color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-row">
      <div class="logo">REMI<em>.FLOW</em></div>
      <div class="today" id="todayBadge"></div>
    </div>
    <div class="page-dots" id="pageDots"></div>
  </div>
  <div class="sw-wrap" id="swWrap">
    <div class="sw-inner" id="swInner">
      <div class="sw-page" id="pg0"></div><!-- 홈 -->
      <div class="sw-page" id="pg1"></div><!-- 가계부 -->
      <div class="sw-page" id="pg2"></div><!-- 구직 -->
      <div class="sw-page" id="pg3"></div><!-- SKINZIP -->
      <div class="sw-page" id="pg4"></div><!-- 세무 -->
    </div>
  </div>
</div>

<div class="bnav">
  <button class="nbtn on" id="nb0" onclick="goPage(0)">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>홈
  </button>
  <button class="nbtn" id="nb1" onclick="goPage(1)">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>가계부
  </button>
  <button class="nbtn" id="nb2" onclick="goPage(2)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>구직
  </button>
  <button class="nbtn" id="nb3" onclick="goPage(3)">
    <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>SKINZIP
  </button>
  <button class="nbtn" id="nb4" onclick="goPage(4)">
    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>세무
  </button>
</div>

<script>
// ══════════════════════════════════
// DATA
// ══════════════════════════════════
const TODAY = new Date();
const MN = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const MONTH_KEYS = ['m9','m10','m11','m12','m1','m2','m3','m4'];
const MONTH_LABELS = {m9:'9월',m10:'10월',m11:'11월',m12:'12월',m1:'1월',m2:'2월',m3:'3월',m4:'4월'};
const MONTH_COLORS = ['#4F86C6','#E07B39','#5BAD6F','#9B6DC4','#D94F5C','#3AACB8','#C4934A','#6B8E5E'];
const ML_FULL = {
  '2026-09':'2026년 9월','2026-10':'2026년 10월','2026-11':'2026년 11월','2026-12':'2026년 12월',
  '2027-01':'2027년 1월','2027-02':'2027년 2월','2027-03':'2027년 3월',
  '2027-04':'2027년 4월','2027-05':'2027년 5월'
};

// ── 가계부 ──
const STARTS = {m9:995};
const BASE_INCOME = {
  m9:[{day:16,name:'구직급여 2차',amount:190},{day:25,name:'아빠연금',amount:129}],
  m10:[{day:14,name:'구직급여 3차',amount:190},{day:25,name:'아빠연금',amount:129}],
  m11:[{day:11,name:'구직급여 4차',amount:190},{day:25,name:'아빠연금',amount:129}],
  m12:[{day:9,name:'구직급여 5차',amount:190},{day:25,name:'아빠연금',amount:129}],
  m1:[{day:6,name:'구직급여 6차',amount:190},{day:25,name:'아빠연금',amount:129}],
  m2:[{day:3,name:'구직급여 7차',amount:190},{day:25,name:'아빠연금',amount:129}],
  m3:[{day:3,name:'구직급여 8차',amount:220},{day:25,name:'아빠연금',amount:129}],
  m4:[{day:25,name:'아빠연금',amount:129}]
};
const BASE_CARD=[{day:15,name:'롯데카드',amount:15},{day:15,name:'우리카드',amount:15},{day:15,name:'신한카드',amount:120},{day:15,name:'현대카드',amount:50}];
const BASE_LOAN=[{day:6,name:'우리은행',amount:0.5},{day:15,name:'씨티은행',amount:60},{day:23,name:'스마트저축은행',amount:80},{day:24,name:'우리은행',amount:3},{day:25,name:'다올저축',amount:40},{day:25,name:'JT친애저축은행',amount:44}];
const BASE_FIXED=[{day:16,name:'교보생명',amount:37}];
const PENSION_MONTHS=['m10','m11','m12','m1','m2','m3','m4'];
const BASE_ETC={
  m9:[{day:4,name:'가족 상황',amount:500,special:true},{day:31,name:'생활비',amount:30}],

// 가계부 HELPERS
// ══════════════════════════════════
function getItems(mk){
  const fixed=[...BASE_FIXED.map(r=>({...r}))];
  if(PENSION_MONTHS.includes(mk)) fixed.push({day:25,name:'국민연금 추납',amount:2});
  const s=state[mk]||{};
  return {
    income:[...BASE_INCOME[mk]||[],...(s.income||[])],
    card:[...(s.cardOverrides?BASE_CARD.map(c=>({...c,amount:s.cardOverrides[c.name]??c.amount})):BASE_CARD.map(c=>({...c}))),...(s.extraCard||[])],
    loan:[...BASE_LOAN.map(r=>({...r})),...(s.extraLoan||[])],
    fixed:[...fixed,...(s.extraFixed||[])],
    etc:[...(BASE_ETC[mk]||[]).map(r=>({...r})),...(s.extraEtc||[])],
  };
}
function calcMonth(mk){
  const start=STARTS[mk]||0;
  const items=getItems(mk);
  const inc=items.income.reduce((a,r)=>a+r.amount,0);
  const out=[...items.card,...items.loan,...items.fixed,...items.etc].reduce((a,r)=>a+r.amount,0);
  return{start,inc,out,end:start+inc-out,items};
}
function calcAll(){
  MONTH_KEYS.forEach((mk,i)=>{
    if(i===0) return;
    STARTS[mk]=Math.round(calcMonth(MONTH_KEYS[i-1]).end);
  });
}
function fmt(n,sign){
  const s=Math.abs(Math.round(n)).toLocaleString()+'만';
  return sign===1?'+'+s:sign===-1?'-'+s:s;
}
function taskDate(t){const[y,m]=t.mkey.split('-').map(Number);return new Date(y,m-1,t.day||15);}
function isThisMonth(t){const d=taskDate(t);return d.getFullYear()===TODAY.getFullYear()&&d.getMonth()===TODAY.getMonth();}
function daysAway(t){return Math.round((taskDate(t)-TODAY)/864e5);}
function chkSvg(){return'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';}

function renderHome(){
  calcAll();
  const idx=MONTH_KEYS.indexOf(curMKey);
  const color=MONTH_COLORS[idx];
  const {start,inc,out,end,items}=calcMonth(curMKey);

  // 전체 일정 진행률
  const allT=TASKS.length+PROD1.length+PROD2.length;
  const allD=TASKS.filter(t=>taskChecked[t.id]).length+PROD1.filter(p=>taskChecked[p.id]).length+PROD2.filter(p=>taskChecked[p.id]).length;
  const pct=allT?Math.round(allD/allT*100):0;

  // 15일/25일 자금
  const allFlat=[
    ...items.card.map(t=>({...t,cat:'card',sign:-1})),
    ...items.loan.map(t=>({...t,cat:'loan',sign:-1})),
    ...items.fixed.map(t=>({...t,cat:'fixed',sign:-1})),
    ...items.income.map(t=>({...t,cat:'income',sign:1})),
  ];
  const f15=allFlat.filter(t=>[14,15,16].includes(t.day));
  const f25=allFlat.filter(t=>[23,24,25,26].includes(t.day));
  const s15=state[curMKey]||{};
  function fundCard(items,label,fkey){
    const outItems=items.filter(t=>t.sign===-1);
    const inItems=items.filter(t=>t.sign===1);
    const total=outItems.reduce((a,t)=>a+t.amount,0);
    const totalIn=inItems.reduce((a,t)=>a+t.amount,0);
    const cks=s15.fundChecks||{};
    const doneAmt=outItems.filter(t=>cks[fkey+'_'+t.name+'_'+t.day]).reduce((a,t)=>a+t.amount,0);
    const allDone=outItems.length>0&&outItems.every(t=>cks[fkey+'_'+t.name+'_'+t.day]);
    const rows=outItems.slice(0,4).map(t=>{
      const k=fkey+'_'+t.name+'_'+t.day;
      const ck=cks[k];
      return`<div class="fund-item${ck?' done-item':''}"><span>${t.name}</span><span>-${Math.round(t.amount).toLocaleString()}만</span></div>`;
    }).join('');
    const incRow=totalIn>0?`<div class="fund-item"><span style="color:var(--blue)">수입</span><span style="color:var(--blue)">+${Math.round(totalIn).toLocaleString()}만</span></div>`:'';
    const remain=doneAmt>0?`<div class="fund-remain"><span style="color:var(--text3)">잔여</span><span style="color:var(--danger)">-${Math.round(total-doneAmt).toLocaleString()}만</span></div>`:'';
    return`<div class="fund-card">
      <div class="fund-title">${label}
        <div class="fund-chk${allDone?' on':''}" onclick="toggleFundAll('${fkey}','${curMKey}')">${chkSvg()}</div>
      </div>
      <div class="fund-total">-${Math.round(total).toLocaleString()}만</div>
      ${incRow}${rows}${remain}
    </div>`;
  }

  // 긴급 일정
  const urgentT=TASKS.filter(t=>!taskChecked[t.id]&&t.pri==='urg'&&isThisMonth(t)).slice(0,4);
  const urgentP=[...PROD1,...PROD2].filter(p=>!taskChecked[p.id]&&p.pri==='urg'&&new Date(p.date)>=TODAY&&(new Date(p.date)-TODAY)/864e5<=31).slice(0,3);

  let h=`
  <div class="stat-grid">
    <div class="stat-box">
      <div class="stat-label">📅 ${MN[TODAY.getMonth()]} 예상 잔액</div>
      <div class="stat-val" style="color:${end<0?'var(--danger)':end<50?'var(--warning)':'var(--text)'}">${Math.round(end).toLocaleString()}만</div>
      <div class="stat-sub">시작 ${Math.round(start).toLocaleString()}만</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">📊 전체 진행</div>
      <div class="stat-val" style="color:var(--accent)">${pct}%</div>
      <div class="stat-sub">${allD}/${allT} 완료</div>
    </div>
  </div>
  <div class="sec-title">💳 이번달 자금 현황</div>
  <div class="fund-grid">${fundCard(f15,'15일 자금','f15')}${fundCard(f25,'25일 자금','f25')}</div>
  <div class="sec-title">🔴 이번달 긴급 일정</div>
  <div class="card">`;
  if(!urgentT.length&&!urgentP.length){
    h+=`<div class="empty">✅ 이번달 긴급 일정 없음</div>`;
  } else {
    const tcColors={'구직':'#3B82F6','세무':'#D97706'};
    urgentT.forEach(t=>{
      const c=tcColors[t.cat]||'#999';
      const isDone=!!taskChecked[t.id];
      h+=`<div class="card-row">
        <div class="dot8" style="background:${c}"></div>
        <div class="row-body"><div class="row-title">${t.title}</div><div class="row-sub">${t.date}</div></div>
        <span class="tag" style="background:#EFF6FF;color:${c}">${t.cat}</span>
        <div class="chk${isDone?' on':''}" onclick="toggleTask(${t.id})">${chkSvg()}</div>
      </div>`;
    });
    urgentP.forEach(p=>{
      const isDone=!!taskChecked[p.id];
      const isProd1=PROD1.some(x=>x.id===p.id);
      h+=`<div class="card-row">
        <div class="dot8" style="background:${isProd1?'var(--accent)':'var(--accent2)'}"></div>
        <div class="row-body"><div class="row-title">${p.title}</div><div class="row-sub">${p.dateLabel}</div></div>
        <span class="tag" style="background:#E8F5EE;color:var(--accent)">${isProd1?'1호':'2호'}</span>
        <div class="chk${isDone?' on':''}" onclick="toggleProd('${p.id}')">${chkSvg()}</div>
      </div>`;
    });
  }
  h+=`</div>

function toggleFundAll(fkey,mk){
  if(!state[mk]) state[mk]={};
  if(!state[mk].fundChecks) state[mk].fundChecks={};
  const {items}=calcMonth(mk);
  const allFlat=[...items.card,...items.loan,...items.fixed,...items.income];
  const days=fkey==='f15'?[14,15,16]:[23,24,25,26];
  const outItems=allFlat.filter(t=>days.includes(t.day)&&t.sign!==1);
  const allDone=outItems.every(t=>state[mk].fundChecks[fkey+'_'+t.name+'_'+t.day]);
  outItems.forEach(t=>{state[mk].fundChecks[fkey+'_'+t.name+'_'+t.day]=!allDone;});
  saveAll(); renderHome();
}

// 가계부
// ══════════════════════════════════
function renderLedger(){
  calcAll();
  const idx=MONTH_KEYS.indexOf(curMKey);
  const color=MONTH_COLORS[idx];
  const {start,inc,out,end,items}=calcMonth(curMKey);
  const s=state[curMKey]||{};
  const checks=s.txChecks||{};

  // 탭
  let tabs=MONTH_KEYS.map((mk,i)=>{
    const c=MONTH_COLORS[i];
    return`<button class="mtab${mk===curMKey?' on':''}" style="${mk===curMKey?`background:${c};border-color:${c};color:white`:''}" onclick="switchMonth('${mk}')">${MONTH_LABELS[mk]}</button>`;
  }).join('');

  // 날짜순 정렬
  const allItems=[
    ...items.income.map((t,i)=>({...t,cat:'income',sign:1,idx:i})),
    ...items.card.map((t,i)=>({...t,cat:'card',sign:-1,idx:i})),
    ...items.loan.map((t,i)=>({...t,cat:'loan',sign:-1,idx:i})),
    ...items.fixed.map((t,i)=>({...t,cat:'fixed',sign:-1,idx:i})),
    ...items.etc.map((t,i)=>({...t,cat:'etc',sign:-1,idx:i})),
  ].sort((a,b)=>a.day-b.day);
  let running=start;
  allItems.forEach(t=>{running+=t.sign*t.amount;t.running=running;});

  const SECS=[
    {cat:'income',label:'수입',sign:1,color:'var(--blue)'},
    {cat:'card',label:'카드 상환',sign:-1,color:'var(--danger)'},
    {cat:'loan',label:'대출 상환',sign:-1,color:'var(--danger)'},
    {cat:'fixed',label:'정기 납부',sign:-1,color:'var(--orange)'},
    {cat:'etc',label:'기타',sign:-1,color:'var(--text3)'},
  ];

  let h=`<div class="month-tabs">${tabs}</div>
  <div class="sum-grid">
    <div class="sum-box"><div class="sum-label">이번달 시작</div><div class="sum-val" style="color:var(--text2)">${Math.round(start).toLocaleString()}만</div></div>
    <div class="sum-box"><div class="sum-label">이번달 예상</div><div class="sum-val" style="color:${end<0?'var(--danger)':end<50?'var(--warning)':'var(--text)'}">${Math.round(end).toLocaleString()}만</div></div>
    <div class="sum-box"><div class="sum-label">총 수입</div><div class="sum-val" style="color:var(--blue)">${fmt(inc,1)}</div></div>
    <div class="sum-box"><div class="sum-label">총 지출</div><div class="sum-val" style="color:var(--danger)">${fmt(out,-1)}</div></div>
  </div>
  <div class="prog-bar-wrap"><div class="prog-bar-fill" style="width:${Math.max(0,Math.min(100,end/300*100))}%;background:${color}"></div></div>`;

  SECS.forEach(sec=>{
    const list=allItems.filter(t=>t.cat===sec.cat);
    if(!list.length) return;
    const subtotal=list.reduce((a,t)=>a+t.amount,0);
    const doneAmt=list.filter(t=>checks[sec.cat+'_'+t.idx]).reduce((a,t)=>a+t.amount,0);
    const doneTag=doneAmt>0?` <span style="font-size:10px;color:var(--accent)">(${Math.round(doneAmt).toLocaleString()}만 완료)</span>`:'';
    h+=`<div class="tx-section">
      <div class="tx-sec-head">
        <span class="tx-sec-label">${sec.label}</span>
        <span class="tx-sec-total" style="color:${sec.color}">${fmt(subtotal,sec.sign)}${doneTag}</span>
      </div>`;
    list.forEach(t=>{
      const ck=checks[sec.cat+'_'+t.idx];
      h+=`<div class="tx-card">
        <div class="tx-row${ck?' done-tx':''}">
          <div class="chk${ck?' on':''}" onclick="toggleTx('${sec.cat}',${t.idx},'${curMKey}')">${chkSvg()}</div>
          <div class="tx-body">
            <div class="tx-name${ck?' crossed':''}">${t.name}</div>
            <div class="tx-date">${t.day}일</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount ${sec.sign===1?'income':'expense'}">${fmt(t.amount,sec.sign)}</div>
            <div class="tx-balance" style="${t.running<0?'color:var(--danger)':''}">${Math.round(t.running).toLocaleString()}만</div>
          </div>
        </div>
      </div>`;
    });
    h+=`<button class="add-item-btn" onclick="toggleAddForm('${sec.cat}')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>항목 추가
    </button>
    <div class="inline-form${addFormOpen[sec.cat]?' open':''}" id="af-${sec.cat}">
      <div class="fi-row">
        <input class="fi" type="number" id="fi-day-${sec.cat}" placeholder="일" style="max-width:60px;margin-bottom:0">
        <input class="fi" type="text" id="fi-name-${sec.cat}" placeholder="항목명" style="margin-bottom:0">
        <input class="fi" type="number" id="fi-amt-${sec.cat}" placeholder="금액(만)" style="max-width:80px;margin-bottom:0">
      </div>
      <div class="f-btns" style="margin-top:7px">
        <button class="f-ok" onclick="addTxItem('${sec.cat}','${curMKey}')">추가</button>
        <button class="f-cancel" onclick="toggleAddForm('${sec.cat}')">취소</button>
      </div>
    </div>`;
    h+=`</div>`;
  });

  h+=`<div class="totals-card">
    <div class="tot-row"><span style="color:var(--text3)">시작 잔액</span><span>${Math.round(start).toLocaleString()}만</span></div>
    <div class="tot-row"><span style="color:var(--blue)">+ 총 수입</span><span style="color:var(--blue)">${fmt(inc,1)}</span></div>
    <div class="tot-row"><span style="color:var(--danger)">− 총 지출</span><span style="color:var(--danger)">${fmt(out,-1)}</span></div>
    <div class="tot-row big"><span>예상 잔액</span><span style="color:${end<0?'var(--danger)':end<50?'var(--warning)':'var(--text)'}">${Math.round(end).toLocaleString()}만</span></div>
  </div>`;

  document.getElementById('pg1').innerHTML=h;
}

function switchMonth(mk){ curMKey=mk; saveAll(); renderLedger(); renderHome(); }
function toggleTx(cat,idx,mk){
  if(!state[mk]) state[mk]={};
  if(!state[mk].txChecks) state[mk].txChecks={};
  const k=cat+'_'+idx;
  state[mk].txChecks[k]=!state[mk].txChecks[k];
  saveAll(); renderLedger(); renderHome();
}
function toggleAddForm(cat){addFormOpen[cat]=!addFormOpen[cat];renderLedger();}
function addTxItem(cat,mk){
  const day=parseInt(document.getElementById('fi-day-'+cat).value);
  const name=document.getElementById('fi-name-'+cat).value.trim();
  const amt=parseFloat(document.getElementById('fi-amt-'+cat).value);
  if(!day||!name||isNaN(amt)) return;
  if(!state[mk]) state[mk]={};
  const key='extra'+cat.charAt(0).toUpperCase()+cat.slice(1);
  if(!state[mk][key]) state[mk][key]=[];
  state[mk][key].push({day,name,amount:amt});
  addFormOpen[cat]=false; saveAll(); renderLedger(); renderHome();
}

  const sorted=[...prods].sort((a,b)=>new Date(a.date)-new Date(b.date));

        <div class="prod-name" style="color:${color}">${name}</div>
        <span class="prod-badge" style="background:${bg};color:${color}">${done}/${prods.length} 완료</span>
      </div>
      <div class="prod-prog-wrap"><div class="prod-prog" style="width:${pct}%;background:${color}"></div></div>
      <div class="prod-prog-nums"><span>완료 ${done}건</span><span style="font-weight:700;color:${color}">${pct}%</span></div>

      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>바로가기</a>`:'';
    h+=`<div class="prod-item${isDone?' done-tc':''}">
      <div class="prod-item-head" onclick="togProdDet('${p.id}')">
        <div class="prod-item-chk${isDone?' on':''}" onclick="event.stopPropagation();toggleProd('${p.id}')">${chkSvg()}</div>
        <div class="pri-dot" style="background:${priColor}"></div>
        <div class="prod-item-body">
          <div class="prod-item-title${isDone?' crossed':''}">${p.title}</div>
          <div class="prod-item-date">${p.dateLabel}</div>
        </div>
        <div class="prod-item-arr${detOpen[dk]?' open':''}" id="parr${p.id}">›</div>
      </div>
      <div class="prod-item-detail${detOpen[dk]?' open':''}" id="pdet${p.id}">
        <div class="detail-text">${p.detail}</div>
        <div class="done-label">완료기준: ${p.done_label}</div>
        ${link}
        <div style="margin-bottom:4px;font-size:11px;color:var(--text3)">날짜·내용 수정:</div>
        <div class="edit-row">
          <input class="edit-input" type="text" id="ed-date-${p.id}" value="${p.dateLabel}" placeholder="날짜">
          <input class="edit-input" type="text" id="ed-title-${p.id}" value="${p.title}" placeholder="제목">
          <button class="edit-save" onclick="saveProdEdit('${p.id}','${prodKey}')">저장</button>
        </div>
        <div style="margin-top:8px">
          <textarea class="memo-area" id="pma${p.id}" placeholder="메모...">${memo}</textarea>
          <button class="memo-save-btn" onclick="saveProdMemo('${p.id}')">저장</button>

    </div>`;

  </button>
  <div class="prod-add-form${addFormOpen[afk]?' open':''}" id="${afk}">

    <div class="f-btns">
      <button class="f-ok" onclick="addProdItem('${prodKey}')">추가</button>

    </div>
  </div>`;
  h+=`</div></div>`;
  return h;
}

// NAV & SWIPE
// ══════════════════════════════════
const DOT_COLORS=['#555','var(--blue)','#3B82F6','var(--accent)','var(--orange)'];
let curPageIdx=0;

function goPage(n){
  curPageIdx=Math.max(0,Math.min(4,n));
  document.getElementById('swInner').style.transform=`translateX(-${curPageIdx*100}%)`;
  updateNav();
}
function updateNav(){
  ['nb0','nb1','nb2','nb3','nb4'].forEach((id,i)=>{
    const el=document.getElementById(id);
    if(el) el.className='nbtn'+(i===curPageIdx?' on':'');
  });
  document.getElementById('pageDots').innerHTML=Array(5).fill(0).map((_,i)=>{
    const colors=['#555','#3B82F6','#3B82F6','#1B7A3E','#D97706'];
    return`<div class="pdot${i===curPageIdx?' on':''}" style="${i===curPageIdx?`background:${colors[i]};`:''}""></div>`;
  }).join('');
}

(function(){
  let sx=0,sy=0,moved=false;
  const wrap=document.getElementById('swWrap');
  wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;},{passive:true});
  wrap.addEventListener('touchmove',e=>{
    const dx=Math.abs(e.touches[0].clientX-sx),dy=Math.abs(e.touches[0].clientY-sy);
    if(dx>dy&&dx>8)moved=true;
  },{passive:true});
  wrap.addEventListener('touchend',e=>{
    if(!moved)return;
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)<40)return;
    goPage(dx<0?curPageIdx+1:curPageIdx-1);
  },{passive:true});
})();

function renderAll(){
  calcAll();
  renderHome();
  renderLedger();
  renderTaskPage('pg2','구직','#3B82F6','구직급여');
  renderSkinzip();
  renderTaskPage('pg4','세무','#D97706','세무');
  updateNav();
  const inner=document.getElementById('swInner');
  inner.style.transition='none';
  inner.style.transform=`translateX(-${curPageIdx*100}%)`;
  setTimeout(()=>{inner.style.transition='';},30);
}

// INIT
document.getElementById('todayBadge').textContent=MN[TODAY.getMonth()]+' '+TODAY.getDate()+'일';
loadAll();
renderAll();
</script>
</body>
</html>
