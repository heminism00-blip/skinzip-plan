<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="REMI.FLOW">
<meta name="color-scheme" content="light only">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>REMI.FLOW</title>
<style>
:root {
  --bg: #F7F7F5;
  --surface: #FFFFFF;
  --border: #EBEBEA;
  --text: #111111;
  --text2: #444444;
  --text3: #888888;
  --accent: #1B7A3E;
  --accent2: #059669;
  --blue: #2563EB;
  --orange: #D97706;
  --red: #DC2626;
  --yellow: #F59E0B;
  --radius: 14px;
  --shadow: 0 1px 6px rgba(0,0,0,0.07);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: #F7F7F5 !important; color-scheme: light only; }
body { background: #F7F7F5 !important; color: #111111 !important; font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; min-height: 100vh; -webkit-text-size-adjust: 100%; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #F7F7F5; padding-bottom: 76px; }

/* ── HEADER ── */
.hdr { background: #fff !important; border-bottom: 1px solid #EBEBEA; padding: 14px 16px 10px; position: sticky; top: 0; z-index: 100; }
.hdr-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.logo { font-size: 19px; font-weight: 900; color: #111 !important; letter-spacing: -0.5px; }
.logo em { color: #1B7A3E; font-style: normal; }
.today-badge { font-size: 12px; color: #888 !important; background: #F7F7F5; padding: 5px 11px; border-radius: 12px; font-weight: 500; }
.pdots { display: flex; gap: 5px; justify-content: center; }
.pdot { width: 5px; height: 5px; border-radius: 3px; background: #D1D1D6; transition: all 0.2s; }
.pdot.on { width: 20px; }

/* ── SWIPE ── */
.sw-wrap { overflow: hidden; touch-action: pan-y; }
.sw-inner { display: flex; transition: transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94); }
.sw-page { min-width: 100vw; max-width: 480px; padding: 14px 14px 0; }

/* ── COMMON ── */
.sec-label { font-size: 11px; font-weight: 800; color: #888 !important; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 2px 8px; }
.wcard { background: #fff !important; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
.crow { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-bottom: 1px solid #F7F7F5; }
.crow:last-child { border-bottom: none; }
.cdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.cbody { flex: 1; min-width: 0; }
.ctitle { font-size: 14px; font-weight: 600; color: #111 !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.csub { font-size: 11px; color: #888 !important; margin-top: 2px; }
.ctag { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 9px; flex-shrink: 0; }
.chk { width: 23px; height: 23px; border-radius: 7px; border: 1.5px solid #D1D1D6; background: #F9F9F9 !important; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.chk.on { background: #1B7A3E !important; border-color: #1B7A3E; }
.chk svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2.5; }
.empty-msg { text-align: center; padding: 22px; color: #C7C7CC !important; font-size: 13px; }

/* ── HOME STATS ── */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 14px; }
.sbox { background: #fff !important; border-radius: var(--radius); padding: 15px 15px; box-shadow: var(--shadow); }
.slabel { font-size: 11px; color: #888 !important; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.sval { font-size: 23px; font-weight: 800; color: #111 !important; letter-spacing: -0.5px; }
.ssub { font-size: 11px; color: #888 !important; margin-top: 3px; }

/* ── FUND CARDS ── */
.fund-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 14px; }
.fund-card { background: #fff !important; border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
.fund-title { font-size: 12px; font-weight: 800; color: #444 !important; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.fund-total { font-size: 21px; font-weight: 800; color: #DC2626 !important; letter-spacing: -0.5px; margin-bottom: 6px; }
.fund-income { font-size: 14px; font-weight: 700; color: #2563EB !important; margin-bottom: 6px; }
.fund-item { display: flex; justify-content: space-between; font-size: 11px; color: #888 !important; padding: 2px 0; }
.fund-item.done-fi { opacity: 0.35; text-decoration: line-through; }
.fund-remain { margin-top: 8px; padding-top: 8px; border-top: 1px solid #F7F7F5; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
.fchk { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #D1D1D6; background: #F9F9F9 !important; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.fchk.on { background: #1B7A3E !important; border-color: #1B7A3E; }
.fchk svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 2.5; }

/* ── SCHEDULE LIST ── */
.sched-item { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-bottom: 1px solid #F7F7F5; }
.sched-item:last-child { border-bottom: none; }
.sched-item.done-sched { opacity: 0.38; }
.sched-left { flex: 1; min-width: 0; }
.sched-title { font-size: 14px; font-weight: 600; color: #111 !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sched-title.crossed { text-decoration: line-through; color: #C7C7CC !important; }
.sched-date { font-size: 11px; color: #888 !important; margin-top: 2px; }
.sched-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px; flex-shrink: 0; }
.pri-bar { width: 3px; height: 36px; border-radius: 2px; flex-shrink: 0; }

/* ── SKINZIP: 월탭 + 카드 ── */
.prod-month-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.prod-month-tabs::-webkit-scrollbar { display: none; }
.pmtab { flex-shrink: 0; padding: 8px 14px; border-radius: 20px; border: 1.5px solid #EBEBEA; background: #fff !important; color: #888 !important; font-size: 12px; font-weight: 700; cursor: pointer; position: relative; }
.pmtab.on { color: #fff !important; border-color: transparent; }
.pmtab-dot { position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: #1B7A3E; display: none; }
.pmtab-dot.show { display: block; }

.prod-month-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 2px; }
.prod-month-name { font-size: 18px; font-weight: 900; color: #111 !important; letter-spacing: -0.5px; }
.prod-month-prog { font-size: 12px; color: #888 !important; font-weight: 600; }

/* 1호/2호 섹션 */
.prod-section { margin-bottom: 12px; }
.prod-sec-head { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; background: #fff !important; border-radius: var(--radius) var(--radius) 0 0; box-shadow: var(--shadow); cursor: pointer; }
.prod-sec-name { font-size: 15px; font-weight: 800; }
.prod-sec-cnt { font-size: 12px; color: #888 !important; }
.prod-sec-body { background: #fff !important; border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow); overflow: hidden; border-top: 1px solid #F7F7F5; }

.prod-item { border-bottom: 1px solid #F7F7F5; }
.prod-item:last-child { border-bottom: none; }
.prod-item-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
.prod-chk { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid #D1D1D6; background: #F9F9F9 !important; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.prod-chk.on { background: #1B7A3E !important; border-color: #1B7A3E; }
.prod-chk svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2.5; }
.prod-item-body { flex: 1; min-width: 0; }
.prod-item-title { font-size: 14px; font-weight: 600; color: #111 !important; }
.prod-item-title.crossed { text-decoration: line-through; color: #C7C7CC !important; }
.prod-item-date { font-size: 11px; color: #888 !important; margin-top: 2px; }
.prod-item-arr { font-size: 17px; color: #D1D1D6 !important; flex-shrink: 0; transition: transform 0.2s; }
.prod-item-arr.open { transform: rotate(90deg); }
.pri-pill { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 6px; flex-shrink: 0; }

.prod-det { display: none; padding: 0 14px 13px 46px; }
.prod-det.open { display: block; }
.det-text { font-size: 13px; color: #444 !important; line-height: 1.65; margin-bottom: 6px; }
.det-done { font-size: 11px; color: #888 !important; margin-bottom: 8px; }
.det-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #1B7A3E !important; background: #E8F5EE !important; padding: 5px 10px; border-radius: 8px; text-decoration: none; font-weight: 600; margin-bottom: 8px; }
.edit-row { display: flex; gap: 6px; margin-bottom: 8px; }
.edit-input { flex: 1; padding: 8px 10px; border-radius: 9px; border: 1px solid #EBEBEA; font-size: 13px; color: #111 !important; background: #F7F7F5 !important; outline: none; font-family: inherit; }
.edit-input:focus { border-color: #1B7A3E; background: #fff !important; }
.edit-save { padding: 8px 12px; border-radius: 9px; background: #1B7A3E !important; color: #fff !important; border: none; font-size: 12px; font-weight: 700; cursor: pointer; }
.memo-area { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid #EBEBEA; font-size: 13px; color: #111 !important; background: #F7F7F5 !important; resize: none; outline: none; font-family: inherit; min-height: 56px; }
.memo-area:focus { border-color: #1B7A3E; background: #fff !important; }
.memo-save { display: inline-block; margin-top: 5px; padding: 6px 13px; border-radius: 8px; background: #1B7A3E !important; color: #fff !important; border: none; font-size: 12px; font-weight: 700; cursor: pointer; }

.add-item-row { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 11px; background: #F7F7F5 !important; cursor: pointer; color: #888 !important; font-size: 12px; font-weight: 600; border: none; width: 100%; }
.add-form-box { display: none; padding: 12px 14px; border-top: 1px solid #F7F7F5; background: #fff !important; }
.add-form-box.open { display: block; }
.fi { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #EBEBEA; font-size: 14px; color: #111 !important; background: #F7F7F5 !important; outline: none; font-family: inherit; margin-bottom: 8px; -webkit-appearance: none; }
.fi:focus { border-color: #1B7A3E; background: #fff !important; }
.fi-row { display: flex; gap: 6px; margin-bottom: 8px; }
.f-btns { display: flex; gap: 6px; }
.f-ok { flex: 1; padding: 11px; border-radius: 10px; background: #1B7A3E !important; color: #fff !important; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
.f-cancel { padding: 11px 14px; border-radius: 10px; background: #F7F7F5 !important; color: #888 !important; border: none; font-size: 14px; cursor: pointer; }

/* ── 구직/세무 ── */
.cat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cat-name { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
.cat-cnt { font-size: 12px; color: #888 !important; font-weight: 600; }
.ps-wrap { margin-bottom: 13px; }
.ps-track { height: 5px; background: #EBEBEA; border-radius: 3px; overflow: hidden; }
.ps-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.ps-nums { display: flex; justify-content: space-between; font-size: 11px; color: #888 !important; margin-top: 5px; font-weight: 600; }
.m-group { margin-bottom: 12px; }
.m-label { font-size: 11px; font-weight: 800; color: #C7C7CC !important; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; padding: 0 2px; }
.tc { background: #fff !important; border-radius: 12px; margin-bottom: 5px; overflow: hidden; box-shadow: var(--shadow); }
.tc.tc-done { opacity: 0.35; }
.tc.urg { border-left: 3px solid #DC2626; }
.tc.hi { border-left: 3px solid #F59E0B; }
.tc-head { display: flex; align-items: center; gap: 10px; padding: 12px 13px; cursor: pointer; }
.tc-chk { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid #D1D1D6; background: #F9F9F9 !important; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.tc-chk.on { background: #1B7A3E !important; border-color: #1B7A3E; }
.tc-chk svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2.5; }
.tc-body { flex: 1; min-width: 0; }
.tc-name { font-size: 14px; font-weight: 600; color: #111 !important; }
.tc-name.crossed { text-decoration: line-through; color: #C7C7CC !important; }
.tc-date { font-size: 11px; color: #888 !important; margin-top: 2px; }
.tc-arr { font-size: 17px; color: #D1D1D6 !important; flex-shrink: 0; transition: transform 0.2s; }
.tc-arr.open { transform: rotate(90deg); }
.tc-det { display: none; padding: 0 13px 12px 45px; }
.tc-det.open { display: block; }
.tc-det-text { font-size: 13px; color: #444 !important; line-height: 1.65; margin-bottom: 5px; }
.tc-done-label { font-size: 11px; color: #888 !important; margin-bottom: 7px; }
.tc-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #1B7A3E !important; background: #E8F5EE !important; padding: 5px 10px; border-radius: 8px; text-decoration: none; font-weight: 600; margin-bottom: 8px; }
.add-task-btn { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 10px; background: #fff !important; border-radius: 12px; border: 1.5px dashed #EBEBEA; cursor: pointer; color: #888 !important; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); margin-bottom: 6px; }
.inline-form { display: none; background: #fff !important; border-radius: 12px; padding: 13px; margin-bottom: 8px; box-shadow: var(--shadow); }
.inline-form.open { display: block; }

/* ── 가계부 ── */
.month-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.month-tabs::-webkit-scrollbar { display: none; }
.mtab { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; border: 1.5px solid #EBEBEA; background: #fff !important; color: #888 !important; font-size: 12px; font-weight: 700; cursor: pointer; }
.mtab.on { color: #fff !important; border-color: transparent; }
.sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.sum-box { background: #fff !important; border-radius: 11px; padding: 11px 13px; box-shadow: var(--shadow); }
.sum-label { font-size: 10px; color: #888 !important; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.sum-val { font-size: 17px; font-weight: 800; color: #111 !important; }
.pb-wrap { height: 4px; background: #EBEBEA; border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
.pb-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.tx-sec { margin-bottom: 10px; }
.tx-sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; padding: 0 2px; }
.tx-sec-label { font-size: 11px; font-weight: 800; color: #888 !important; text-transform: uppercase; letter-spacing: 0.05em; }
.tx-sec-total { font-size: 12px; font-weight: 800; }
.tx-card { background: #fff !important; border-radius: 10px; margin-bottom: 4px; overflow: hidden; box-shadow: var(--shadow); }
.tx-row { display: flex; align-items: center; gap: 10px; padding: 11px 13px; }
.tx-row.done-tx { opacity: 0.35; }
.tx-body { flex: 1; min-width: 0; }
.tx-name { font-size: 13px; font-weight: 600; color: #111 !important; }
.tx-name.crossed { text-decoration: line-through; color: #C7C7CC !important; }
.tx-date { font-size: 11px; color: #888 !important; }
.tx-right { text-align: right; }
.tx-amount { font-size: 13px; font-weight: 700; }
.tx-balance { font-size: 10px; color: #888 !important; }
.add-tx-btn { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 9px; margin-bottom: 6px; background: #fff !important; border-radius: 10px; border: 1.5px dashed #EBEBEA; cursor: pointer; color: #888 !important; font-size: 12px; font-weight: 600; box-shadow: var(--shadow); }
.tot-card { background: #fff !important; border-radius: var(--radius); padding: 13px 15px; box-shadow: var(--shadow); margin-top: 12px; }
.tot-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; color: #444 !important; }
.tot-row.big { font-size: 15px; font-weight: 800; color: #111 !important; border-top: 1px solid #EBEBEA; margin-top: 6px; padding-top: 10px; }

/* ── BOTTOM NAV ── */
.bnav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.97) !important; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #EBEBEA; display: flex; z-index: 200; max-width: 480px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom,0); }
.nbtn { flex: 1; padding: 9px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #888 !important; font-size: 9px; font-weight: 600; text-decoration: none; border: none; background: none; cursor: pointer; font-family: inherit; }
.nbtn svg { width: 22px; height: 22px; stroke-width: 1.5; fill: none; stroke: currentColor; }
.nbtn.on { color: #1B7A3E !important; }
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-row">
      <div class="logo">REMI<em>.FLOW</em></div>
      <div class="today-badge" id="todayBadge"></div>
    </div>
    <div class="pdots" id="pdots"></div>
  </div>
  <div class="sw-wrap" id="swWrap">
    <div class="sw-inner" id="swInner">
      <div class="sw-page" id="pg0"></div>
      <div class="sw-page" id="pg1"></div>
      <div class="sw-page" id="pg2"></div>
      <div class="sw-page" id="pg3"></div>
      <div class="sw-page" id="pg4"></div>
    </div>
  </div>
</div>

<div class="bnav">
  <button class="nbtn on" id="nb0" onclick="goPage(0)">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>홈
  </button>
  <button class="nbtn" id="nb1" onclick="goPage(1)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>구직
  </button>
  <button class="nbtn" id="nb2" onclick="goPage(2)">
    <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>SKINZIP
  </button>
  <button class="nbtn" id="nb3" onclick="goPage(3)">
    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>세무
  </button>
  <button class="nbtn" id="nb4" onclick="goPage(4)">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>가계부
  </button>
</div>

<script>
const TODAY = new Date();
const MN = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
function chkSvg(){ return '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'; }

// ══ 가계부 DATA ══
const MKEYS = ['m9','m10','m11','m12','m1','m2','m3','m4'];
const MLABELS = {m9:'9월',m10:'10월',m11:'11월',m12:'12월',m1:'1월',m2:'2월',m3:'3월',m4:'4월'};
const MCOLORS = ['#4F86C6','#E07B39','#5BAD6F','#9B6DC4','#D94F5C','#3AACB8','#C4934A','#6B8E5E'];
const STARTS = {m9:995};
const BASE_INCOME = {
  m9:[{day:16,name:'구직급여 2차',amount:190},{day:25,name:'아빠연금',amount:129}],
  m10:[{day:14,name:'구직급여 3차',amount:190},{day:25,name:'아빠연금',amount:129}],

// ══ 가계부 HELPERS ══
function getItems(mk){
  const fixed=[...BASE_FIXED.map(r=>({...r}))];
  if(PENSION_MK.includes(mk)) fixed.push({day:25,name:'국민연금 추납',amount:2});
  const s=ledgerState[mk]||{};
  const cards=BASE_CARD.map(c=>({...c,amount:(s.cardOv||{})[c.name]??c.amount}));
  return{
    income:[...BASE_INCOME[mk]||[],...(s.extraIncome||[])],
    card:[...cards,...(s.extraCard||[])],
    loan:[...BASE_LOAN,...(s.extraLoan||[])],
    fixed:[...fixed,...(s.extraFixed||[])],
    etc:[...(BASE_ETC[mk]||[]).map(r=>({...r})),...(s.extraEtc||[])],
  };
}
function calcMonth(mk){
  const start=STARTS[mk]||0;
  const items=getItems(mk);
  const inc=items.income.reduce((a,r)=>a+r.amount,0);
  const out=[...items.card,...items.loan,...items.fixed,...items.etc].reduce((a,r)=>a+r.amount,0);
  return{start,inc,out,end:start+inc-out,items};
}
function calcAll(){
  MKEYS.forEach((mk,i)=>{
    if(i===0) return;
    STARTS[mk]=Math.round(calcMonth(MKEYS[i-1]).end);
  });
}
function fmt(n,sign){
  const s=Math.abs(Math.round(n)).toLocaleString()+'만';
  return sign===1?'+'+s:sign===-1?'-'+s:s;
}

  <div class="fund-grid">${fundCardHTML(f15out,f15in,'15일 자금','f15')}${fundCardHTML(f25out,f25in,'25일 자금','f25')}</div>

  <div class="wcard">`;

  if(!schedItems.length){
    h+=`<div class="empty-msg">✅ 주요 일정 없음</div>`;
  } else {
    schedItems.forEach(t=>{
      const isDone=!!taskChecked[t.id];
      const tColors={'구직':'#2563EB','세무':'#D97706'};
      const color2=t.type==='task'?(tColors[t.cat]||'#888'):(t.prod==='1호'?'#1B7A3E':'#059669');
      const tagBg=t.type==='task'?(t.cat==='구직'?'#EFF6FF':'#FFF7ED'):'#E8F5EE';
      const tagLabel=t.type==='task'?t.cat:t.prod;
      const priColor=t.pri==='urg'?'#DC2626':t.pri==='hi'?'#F59E0B':'#D1D1D6';
      h+=`<div class="sched-item${isDone?' done-sched':''}">
        <div class="pri-bar" style="background:${priColor}"></div>
        <div class="sched-left">
          <div class="sched-title${isDone?' crossed':''}">${t.title}</div>
          <div class="sched-date">${t.date||t.dateLabel||''}</div>
        </div>
        <span class="sched-tag" style="background:${tagBg};color:${color2}">${tagLabel}</span>
        <div class="chk${isDone?' on':''}" onclick="toggleAny('${t.id}')">${chkSvg()}</div>
      </div>`;
    });
  }
  h+=`</div>`;
  document.getElementById('pg0').innerHTML=h;
}

function toggleFund(fkey,mk){
  if(!ledgerState[mk]) ledgerState[mk]={};
  if(!ledgerState[mk].fundChecks) ledgerState[mk].fundChecks={};
  const {items}=calcMonth(mk);
  const days=fkey==='f15'?[14,15,16]:[23,24,25,26];
  const outItems=[...items.card,...items.loan,...items.fixed].filter(t=>days.includes(t.day));
  const allDone=outItems.every(t=>ledgerState[mk].fundChecks[fkey+'_'+t.name+'_'+t.day]);
  outItems.forEach(t=>{ledgerState[mk].fundChecks[fkey+'_'+t.name+'_'+t.day]=!allDone;});
  saveAll(); renderHome();
}
function toggleAny(id){
  const numId=isNaN(id)?id:parseInt(id);
  taskChecked[numId]=!taskChecked[numId];
  saveAll(); renderAll();
}

// ══ 구직/세무 ══

      const memo=taskMemos[t.id]||'';
      h+=`<div class="tc${isDone?' tc-done':''}${pc}">
        <div class="tc-head" onclick="togDet('${dk}')">
          <div class="tc-chk${isDone?' on':''}" onclick="event.stopPropagation();toggleTask(${t.id})">${chkSvg()}</div>
          <div class="tc-body">
            <div class="tc-name${isDone?' crossed':''}">${t.title}</div>
            <div class="tc-date">${t.date}</div>
          </div>
          <div class="tc-arr${detOpen[dk]?' open':''}" id="tarr_${dk}">›</div>
        </div>
        <div class="tc-det${detOpen[dk]?' open':''}" id="tdet_${dk}">
          <div class="tc-det-text">${t.detail}</div>
          <div class="tc-done-label">완료기준: ${t.done_label}</div>
          ${link}
          <textarea class="memo-area" id="tma_${t.id}" placeholder="메모...">${memo}</textarea>
          <button class="memo-save" onclick="saveMemo(${t.id},'tma_')">저장</button>
        </div>
      </div>`;
    });
    h+=`</div>`;
  });
  const afk='aft_'+cat;
  h+=`<button class="add-task-btn" onclick="togForm('${afk}')">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>일정 추가
  </button>
  <div class="inline-form${addFormOpen[afk]?' open':''}" id="${afk}">
    <input class="fi" type="text" id="${afk}_title" placeholder="일정 제목">
    <div class="fi-row">
      <input class="fi" type="text" id="${afk}_date" placeholder="날짜" style="margin-bottom:0;flex:1">
      <select class="fi" id="${afk}_mkey" style="margin-bottom:0;flex:1">
        ${Object.entries({'2026-09':'26년 9월','2026-10':'10월','2026-11':'11월','2026-12':'12월','2027-01':'27년 1월','2027-02':'2월','2027-03':'3월','2027-04':'4월','2027-05':'5월'}).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
      </select>
    </div>
    <input class="fi" type="text" id="${afk}_detail" placeholder="세부 내용" style="margin-top:7px">
    <div class="f-btns" style="margin-top:2px">
      <button class="f-ok" onclick="addTaskItem('${cat}','${afk}')">추가</button>

function togDet(k){detOpen[k]=!detOpen[k];renderAll();}
function toggleTask(id){taskChecked[id]=!taskChecked[id];saveAll();renderAll();}
function saveMemo(id,prefix){const el=document.getElementById(prefix+id);if(el){taskMemos[id]=el.value;saveAll();}}
function togForm(k){addFormOpen[k]=!addFormOpen[k];renderAll();}
function addTaskItem(cat,afk){
  const title=document.getElementById(afk+'_title').value.trim();
  const date=document.getElementById(afk+'_date').value.trim();
  const mkey=document.getElementById(afk+'_mkey').value;
  const detail=document.getElementById(afk+'_detail').value.trim();
  if(!title) return;
  TASKS.push({id:nextId++,cat,mkey,day:15,date:date||'날짜 미정',title,detail:detail||'-',done_label:'완료 확인',pri:'normal'});
  addFormOpen[afk]=false; saveAll(); renderAll();
}

// ══ SKINZIP ══
function renderSkinzip(){
  const allProds=[...PROD1,...PROD2];
  const totalDone=allProds.filter(p=>taskChecked[p.id]).length;
  const totalPct=allProds.length?Math.round(totalDone/allProds.length*100):0;

  // 월탭
  let tabs=PROD_MONTHS.map(pm=>{
    const p1m=PROD1.filter(p=>p.mkey===pm.key);
    const p2m=PROD2.filter(p=>p.mkey===pm.key);
    const hasTasks=p1m.length+p2m.length>0;
    const hasActive=hasTasks&&[...p1m,...p2m].some(p=>!taskChecked[p.id]);
    const isOn=curProdMonth===pm.key;
    return`<button class="pmtab${isOn?' on':''}" style="${isOn?'background:#1B7A3E;':''}" onclick="switchProdMonth('${pm.key}')">
      ${pm.label.replace('2026년 ','').replace('2027년 ','')}
      <span class="pmtab-dot${hasTasks&&!hasActive?' show':''}" style="background:${isOn?'#fff':'#1B7A3E'}"></span>
    </button>`;
  }).join('');

  // 선택된 달의 1호/2호 항목
  const p1m=PROD1.filter(p=>p.mkey===curProdMonth);
  const p2m=PROD2.filter(p=>p.mkey===curProdMonth);
  const curLabel=PROD_MONTHS.find(m=>m.key===curProdMonth)?.label||curProdMonth;
  const curDone=[...p1m,...p2m].filter(p=>taskChecked[p.id]).length;
  const curTotal=p1m.length+p2m.length;

  let h=`<div class="cat-head"><div class="cat-name" style="color:#1B7A3E">SKINZIP</div><div class="cat-cnt">${totalDone}/${allProds.length} 전체</div></div>
  <div class="ps-wrap"><div class="ps-track"><div class="ps-fill" style="width:${totalPct}%;background:#1B7A3E"></div></div>
  <div class="ps-nums"><span>완료 ${totalDone}건</span><span style="font-weight:800;color:#1B7A3E">${totalPct}%</span></div></div>
  <div class="prod-month-tabs">${tabs}</div>
  <div class="prod-month-header">
    <div class="prod-month-name">${curLabel}</div>
    <div class="prod-month-prog">${curDone}/${curTotal} 완료</div>
  </div>`;

  if(!p1m.length&&!p2m.length){
    h+=`<div class="wcard"><div class="empty-msg">이 달 항목 없음<br><span style="font-size:11px;color:#C7C7CC">아래 + 버튼으로 추가하세요</span></div></div>`;
  }

  function prodSection(prods,name,color,bg,prodKey){
    if(!prods.length&&prodKey==='p2') return'';
    const done=prods.filter(p=>taskChecked[p.id]).length;
    let sh=`<div class="prod-section">
      <div class="prod-sec-head">
        <div class="prod-sec-name" style="color:${color}">${name}</div>
        <div class="prod-sec-cnt">${done}/${prods.length}</div>
      </div>
      <div class="prod-sec-body">`;
    prods.forEach(p=>{
      const isDone=!!taskChecked[p.id];
      const dk='dp_'+p.id;
      const priColor=p.pri==='urg'?'#DC2626':p.pri==='hi'?'#F59E0B':'#D1D1D6';
      const priLabel=p.pri==='urg'?'긴급':p.pri==='hi'?'높음':'';
      const link=p.url?`<a href="${p.url}" target="_blank" class="det-link">바로가기</a>`:'';
      const memo=taskMemos[p.id]||'';
      sh+=`<div class="prod-item${isDone?' tc-done':''}">
        <div class="prod-item-head" onclick="togDet('${dk}')">
          <div class="prod-chk${isDone?' on':''}" onclick="event.stopPropagation();toggleProd('${p.id}')">${chkSvg()}</div>
          ${priLabel?`<span class="pri-pill" style="background:${priColor}22;color:${priColor}">${priLabel}</span>`:''}
          <div class="prod-item-body">
            <div class="prod-item-title${isDone?' crossed':''}">${p.title}</div>
            <div class="prod-item-date">${p.dateLabel}</div>
          </div>
          <div class="prod-item-arr${detOpen[dk]?' open':''}" id="parr_${dk}">›</div>
        </div>
        <div class="prod-det${detOpen[dk]?' open':''}" id="pdet_${dk}">
          <div class="det-text">${p.detail}</div>
          <div class="det-done">완료기준: ${p.done_label}</div>
          ${link}
          <div class="edit-row">
            <input class="edit-input" id="ed_dl_${p.id}" value="${p.dateLabel}" placeholder="날짜">
            <input class="edit-input" id="ed_tt_${p.id}" value="${p.title}" placeholder="제목">
            <button class="edit-save" onclick="saveProdEdit('${p.id}','${prodKey}')">저장</button>
          </div>
          <div style="margin-top:8px">
            <textarea class="memo-area" id="pma_${p.id}" placeholder="메모...">${memo}</textarea>
            <button class="memo-save" onclick="saveMemo('${p.id}','pma_')">저장</button>
          </div>
        </div>
      </div>`;
    });
    // 추가 버튼
    const afk='afp_'+prodKey;
    sh+=`<button class="add-item-row" onclick="togForm('${afk}')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>${name} 항목 추가
    </button>
    <div class="add-form-box${addFormOpen[afk]?' open':''}" id="${afk}">
      <input class="fi" id="${afk}_title" placeholder="일정 제목">
      <input class="fi" id="${afk}_dl" placeholder="날짜 표시 (예: 2월 2주)">
      <input class="fi" id="${afk}_detail" placeholder="세부 내용">
      <div class="f-btns">
        <button class="f-ok" onclick="addProdItem('${prodKey}','${curProdMonth}','${afk}')">추가</button>
        <button class="f-cancel" onclick="togForm('${afk}')">취소</button>
      </div>
    </div>`;
    sh+=`</div></div>`;
    return sh;
  }

  h+=prodSection(p1m,'1호 제품','#1B7A3E','#E8F5EE','p1');
  if(p2m.length) h+=prodSection(p2m,'2호 제품','#059669','#E3F7F0','p2');

  document.getElementById('pg2').innerHTML=h;
}

function switchProdMonth(mk){curProdMonth=mk;saveAll();renderSkinzip();}
function toggleProd(id){taskChecked[id]=!taskChecked[id];saveAll();renderAll();}
function saveProdEdit(id,key){
  const dl=document.getElementById('ed_dl_'+id)?.value.trim();
  const tt=document.getElementById('ed_tt_'+id)?.value.trim();
  const arr=key==='p1'?PROD1:PROD2;
  const p=arr.find(x=>x.id===id);
  if(p){if(dl)p.dateLabel=dl;if(tt)p.title=tt;}
  saveAll(); renderSkinzip();
}
function addProdItem(key,mkey,afk){
  const title=document.getElementById(afk+'_title')?.value.trim();
  const dl=document.getElementById(afk+'_dl')?.value.trim();
  const detail=document.getElementById(afk+'_detail')?.value.trim();
  if(!title) return;
  const newId=(key==='p1'?'px':'py')+nextId++;
  const item={id:newId,mkey,dateLabel:dl||'날짜 미정',title,detail:detail||'-',done_label:'완료 확인',pri:'normal'};
  if(key==='p1') PROD1.push(item); else PROD2.push(item);
  addFormOpen[afk]=false; saveAll(); renderSkinzip();
}

// ══ 가계부 ══
function renderLedger(){
  calcAll();
  const idx=MKEYS.indexOf(curMKey);
  const color=MCOLORS[idx]||'#555';
  const {start,inc,out,end,items}=calcMonth(curMKey);
  const s=ledgerState[curMKey]||{};
  const chks=s.txChecks||{};

  const tabs=MKEYS.map((mk,i)=>`<button class="mtab${mk===curMKey?' on':''}" style="${mk===curMKey?`background:${MCOLORS[i]};border-color:${MCOLORS[i]}`:''}" onclick="switchMonth('${mk}')">${MLABELS[mk]}</button>`).join('');

  const allFlat=[
    ...items.income.map((t,i)=>({...t,cat:'income',sign:1,idx:i})),
    ...items.card.map((t,i)=>({...t,cat:'card',sign:-1,idx:i})),
    ...items.loan.map((t,i)=>({...t,cat:'loan',sign:-1,idx:i})),
    ...items.fixed.map((t,i)=>({...t,cat:'fixed',sign:-1,idx:i})),
    ...items.etc.map((t,i)=>({...t,cat:'etc',sign:-1,idx:i})),
  ].sort((a,b)=>a.day-b.day);
  let running=start;
  allFlat.forEach(t=>{running+=t.sign*t.amount;t.running=running;});

  const SECS=[
    {cat:'income',label:'수입',sign:1,color:'#2563EB'},
    {cat:'card',label:'카드 상환',sign:-1,color:'#DC2626'},
    {cat:'loan',label:'대출 상환',sign:-1,color:'#DC2626'},
    {cat:'fixed',label:'정기 납부',sign:-1,color:'#D97706'},
    {cat:'etc',label:'기타',sign:-1,color:'#888'},
  ];

  let h=`<div class="month-tabs">${tabs}</div>
  <div class="sum-grid">
    <div class="sum-box"><div class="sum-label">이번달 시작</div><div class="sum-val" style="color:#444">${Math.round(start).toLocaleString()}만</div></div>
    <div class="sum-box"><div class="sum-label">이번달 예상</div><div class="sum-val" style="color:${end<0?'#DC2626':end<50?'#F59E0B':'#111'}">${Math.round(end).toLocaleString()}만</div></div>
    <div class="sum-box"><div class="sum-label">총 수입</div><div class="sum-val" style="color:#2563EB">${fmt(inc,1)}</div></div>
    <div class="sum-box"><div class="sum-label">총 지출</div><div class="sum-val" style="color:#DC2626">${fmt(out,-1)}</div></div>
  </div>
  <div class="pb-wrap"><div class="pb-fill" style="width:${Math.max(0,Math.min(100,end/300*100))}%;background:${color}"></div></div>`;

  SECS.forEach(sec=>{
    const list=allFlat.filter(t=>t.cat===sec.cat);
    if(!list.length) return;
    const subtotal=list.reduce((a,t)=>a+t.amount,0);
    const doneAmt=list.filter(t=>chks[sec.cat+'_'+t.idx]).reduce((a,t)=>a+t.amount,0);
    const doneTag=doneAmt>0?` <span style="font-size:10px;color:#1B7A3E;font-weight:700">(${Math.round(doneAmt).toLocaleString()}만 완료)</span>`:'';
    h+=`<div class="tx-sec">
      <div class="tx-sec-head">
        <span class="tx-sec-label">${sec.label}</span>
        <span class="tx-sec-total" style="color:${sec.color}">${fmt(subtotal,sec.sign)}${doneTag}</span>
      </div>`;
    list.forEach(t=>{
      const ck=chks[sec.cat+'_'+t.idx];
      h+=`<div class="tx-card">
        <div class="tx-row${ck?' done-tx':''}">
          <div class="chk${ck?' on':''}" onclick="toggleTx('${sec.cat}',${t.idx},'${curMKey}')">${chkSvg()}</div>
          <div class="tx-body">
            <div class="tx-name${ck?' crossed':''}">${t.name}</div>
            <div class="tx-date">${t.day}일</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount" style="color:${sec.sign===1?'#2563EB':'#DC2626'}">${fmt(t.amount,sec.sign)}</div>
            <div class="tx-balance" style="${t.running<0?'color:#DC2626':''}">${Math.round(t.running).toLocaleString()}만</div>
          </div>
        </div>
      </div>`;
    });
    const afk='afl_'+sec.cat;
    h+=`<button class="add-tx-btn" onclick="togForm('${afk}')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>항목 추가
    </button>
    <div class="inline-form${addFormOpen[afk]?' open':''}" id="${afk}">
      <div class="fi-row">
        <input class="fi" type="number" id="${afk}_day" placeholder="일" style="max-width:60px;margin-bottom:0">
        <input class="fi" type="text" id="${afk}_name" placeholder="항목명" style="margin-bottom:0">
        <input class="fi" type="number" id="${afk}_amt" placeholder="금액(만)" style="max-width:80px;margin-bottom:0">
      </div>
      <div class="f-btns" style="margin-top:8px">
        <button class="f-ok" onclick="addTxItem('${sec.cat}','${curMKey}','${afk}')">추가</button>
        <button class="f-cancel" onclick="togForm('${afk}')">취소</button>
      </div>
    </div>`;
    h+=`</div>`;
  });

  h+=`<div class="tot-card">
    <div class="tot-row"><span style="color:#888">시작 잔액</span><span>${Math.round(start).toLocaleString()}만</span></div>
    <div class="tot-row"><span style="color:#2563EB">+ 총 수입</span><span style="color:#2563EB">${fmt(inc,1)}</span></div>
    <div class="tot-row"><span style="color:#DC2626">− 총 지출</span><span style="color:#DC2626">${fmt(out,-1)}</span></div>
    <div class="tot-row big"><span>예상 잔액</span><span style="color:${end<0?'#DC2626':end<50?'#F59E0B':'#111'}">${Math.round(end).toLocaleString()}만</span></div>
  </div>`;
  document.getElementById('pg4').innerHTML=h;
}

function switchMonth(mk){curMKey=mk;saveAll();renderLedger();renderHome();}
function toggleTx(cat,idx,mk){
  if(!ledgerState[mk]) ledgerState[mk]={};
  if(!ledgerState[mk].txChecks) ledgerState[mk].txChecks={};
  const k=cat+'_'+idx;
  ledgerState[mk].txChecks[k]=!ledgerState[mk].txChecks[k];
  saveAll(); renderLedger(); renderHome();
}
function addTxItem(cat,mk,afk){
  const day=parseInt(document.getElementById(afk+'_day')?.value);
  const name=document.getElementById(afk+'_name')?.value.trim();
  const amt=parseFloat(document.getElementById(afk+'_amt')?.value);
  if(!day||!name||isNaN(amt)) return;
  if(!ledgerState[mk]) ledgerState[mk]={};
  const ek='extra'+cat.charAt(0).toUpperCase()+cat.slice(1);
  if(!ledgerState[mk][ek]) ledgerState[mk][ek]=[];
  ledgerState[mk][ek].push({day,name,amount:amt});
  addFormOpen[afk]=false; saveAll(); renderLedger(); renderHome();
}

// ══ NAV ══
const DOT_COLORS=['#555','#2563EB','#1B7A3E','#D97706','#4F86C6'];
function goPage(n){
  curPage=Math.max(0,Math.min(4,n));
  document.getElementById('swInner').style.transform=`translateX(-${curPage*100}%)`;
  updateNav();
}
function updateNav(){
  ['nb0','nb1','nb2','nb3','nb4'].forEach((id,i)=>{
    const el=document.getElementById(id);
    if(el) el.className='nbtn'+(i===curPage?' on':'');
  });
  document.getElementById('pdots').innerHTML=Array(5).fill(0).map((_,i)=>
    `<div class="pdot${i===curPage?' on':''}" style="${i===curPage?`background:${DOT_COLORS[i]};`:''}"></div>`
  ).join('');
}

(function(){
  let sx=0,sy=0,moved=false;
  const wrap=document.getElementById('swWrap');
  wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;},{passive:true});
  wrap.addEventListener('touchmove',e=>{
    const dx=Math.abs(e.touches[0].clientX-sx),dy=Math.abs(e.touches[0].clientY-sy);
    if(dx>dy&&dx>8)moved=true;
  },{passive:true});
  wrap.addEventListener('touchend',e=>{
    if(!moved)return;
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)<40)return;
    goPage(dx<0?curPage+1:curPage-1);
  },{passive:true});
})();

function renderAll(){
  calcAll();
  renderHome();
  renderTaskPage('pg1','구직','#2563EB','구직급여');
  renderSkinzip();
  renderTaskPage('pg3','세무','#D97706','세무');
  renderLedger();
  updateNav();
  const inner=document.getElementById('swInner');
  inner.style.transition='none';
  inner.style.transform=`translateX(-${curPage*100}%)`;
  setTimeout(()=>{inner.style.transition='';},30);
}

document.getElementById('todayBadge').textContent=MN[TODAY.getMonth()]+' '+TODAY.getDate()+'일';
loadAll();
renderAll();
</script>
